<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Wild Record</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 5px;
        }

        header p {
            color: #aaa;
            margin-top: 12px;
        }

        .gallery {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .record {
            margin-bottom: 70px;
        }

        .record img {
            width: 100%;
            display: block;
        }

        .info {
            padding: 15px 0;
            color: #aaa;
        }

        .record-number {
            color: white;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        footer {
            text-align: center;
            padding: 50px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>THE WILD RECORD</h1>
    <p>A collection of moments found in nature.</p>
</header>

<div class="gallery">

    <div class="record">
        <img src="20251017_143542.jpg" alt="Nature photograph">

        <div class="info">
            <div class="record-number">RECORD 001</div>
            📍  Kyntaiai Valley, Mawsaw, Laitphlang, Meghalaya
        </div>
    </div>

</div>

<footer>
    THE WILD RECORD
</footer>

</body>
</html>
